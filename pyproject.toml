[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prd-workflow"
version = "0.1.0"
description = "PRD Convergence Workflow"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.scripts]
prd = "prd_workflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prd_workflow"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
